submission:
  title: "GridPulse AI"                # REQUIRED — Project display name

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
    Power utilities face catastrophic blackouts costing over $1M/hour due to outdated, calendar-based maintenance on power transformers and substations. 
    While existing IoT hardware tracks signs of mechanical decay, utilities fail to merge streaming operational sensor signatures with upcoming extreme weather forecasts in time to act.

  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
    We built GridPulse AI, an intelligent operations dashboard that processes multi-source utility asset sensor logs and weather forecasts through a multi-stage machine learning pipeline. 
    The system predicts mechanical anomalies, calculates dynamic thermal deviations, and generates a weighted, prioritized crew pre-positioning and grid-risk management plan.

  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - "Unsupervised asset health monitoring and mechanical outlier flagging using an Isolation Forest anomaly detection model."
    - "Virtual sensor baseline simulation using an XGBoost Regressor to calculate thermal deviations under live weather and current loads."
    - "Deterministic risk-ranking engine applying a Weighted Scoring Algorithm to balance machine failure probabilities against critical community impacts."
    - "An enterprise-grade, human-centric user dashboard built with a warm, off-white aesthetic featuring live filterable risk tiers and clear spatial crew deployment triggers."

  tech_stack:
    languages: ["Python", "JavaScript"] # REQUIRED
    frameworks: ["React", "Tailwind CSS", "FastAPI", "Scikit-Learn", "XGBoost"]
    ibm_technologies: ["watsonx.ai", "watsonx.data"]
    databases: ["SQLite"]
    other: ["Jupyter Notebooks", "Lucide Icons", "Git"]

  what_we_are_most_proud_of: >         # Optional but recommended — guides judges to your best work
    We are proud of our high-accuracy hybrid AI pipeline architecture. By splitting the workflow into clear, individual Jupyter Notebook phases, we achieved maximum data transparency—isolating physical abnormalities with unsupervised trees before validating thermal stress via gradient boosting. Blending this technical backend smoothly into an intuitive, custom warm-palette user interface elevates it from a mere code prototype into a deployable enterprise utility application.

  known_limitations: >                 # Optional but recommended — be honest about gaps
    Due to time and data privacy constraints during the hackathon, we utilized synthetic and open-source proxy datasets to simulate grid network configurations rather than real-time, live power grid telemetry. Additionally, our automated crew pre-positioning features operate on simple geographic tags rather than true routing logic integrated with live street traffic data.

